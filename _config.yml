resume_clients:
  - name: "Echo Global Logistics"
    industry: "Transportation Logistics"
    description: "Integrated an acquired stack of IT services using IaC approaches, Chef, .NET, Hyper-V, Azure, TerraForm and DataDog."
  - name: "Western Governors University"
    industry: "Online Education"
    description: "Designed a Data CI pipeline for defining data as code using Liquibase (Datical), Chef, Vagrant and Jenkins."
  - name: "Qlik Technologies"
    industry: "BI Software"
    description: "Lead architect and initial operations of QlikCloud.com, providing Qlik SaaS. Took an enterprise hosted service and enabled it as an on-demand SaaS in less than a year. Delivered a globally distributed, HA and auto-scaling system based on concurrent user login count using: MEAN stack for front-end; AWS, CloudFormation, Puppet for IaC; Consul, New Relic for operations; BlazeMeter, SauceLabs for automated testing."
  - name: "Pepsi"
    industry: "Retail Drinks"
    description: "Supported analysis of vending machine metrics by defining Talend, RDS and Tableau servers as code using CloudFormation on AWS."
  - name: "Law Bulletin"
    industry: "Legal Services"
    description: "Migrated JuraLaw legal docket management system from on-premise Oracle/Liferay/Solr/Jasper stack to AWS. Led the cloud vendor selection process and demonstrated better consistency, agility and sprint velocity using Puppet, CloudFormation & CI/CD. Implemented IaC to ensure consistent environments and add DR ability."
  - name: "Walgreens"
    industry: "Retail Pharmacy"
    description: "Implemented a time-sensitive data de-identification system to meet compliance deadlines and avoid disruption of reporting services. Ensured app data was scrubbed of identifying information before flowing between pharmacies."
  - name: "Blue Cross Blue Shield of Michigan"
    industry: "Health Insurance"
    description: "Lead engineer on a new member portal for insurance members to manage accounts and claims. Scaled team to 22 developers by automating environment setup using RedHat/WebSphere/Oracle and an IaC & CI/CD approach to delivery. Used Backbonejs, Java Spring, Liquibase for MySQL/Oracle, CloudFormation and Puppet."
  - name: "Providence Health & Services"
    industry: "Health Provider"
    description: "Partnered with a new Director of Healthcare Intelligence to establish a system for applying BI principles, tooling and governance to operational and research data marts. Delivered the first two pilot projects analyzing bundled knee surgery packages and stroke services using MSBI and Tableau."
  - name: "Standard Insurance"
    industry: "Insurance Provider"
    description: "Introduced Microsoft BI stack (MSBI) and converted a set of underwriting reports migrated from Cognos. Automated server configuration as code and documented runbook processes. Created center of excellence to define security, governance and training plan."
  - name: "Russell Investments"
    industry: "Financial Services"
    description: "Created SalesForce app to assess which accounts to invest relationship management in, and a dashboard view for users."
  - name: "CorVel Software"
