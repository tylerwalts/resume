    description: "Upgraded, optimized, re-designed and integrated Greenopolis.com site to ThinkGreenRewards.WM.com, and added a portal interface to provide the UI for recycling kiosks. Automated environment cloning of the Drupal LAMP stack using Drush and bash."
  - name: "Nike"
