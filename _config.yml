resume_summary: "
    Engineering leader with 20+ years designing, building, and operating large-scale cloud software and data platforms. A hands-on architect and people leader who has built teams from scratch, transformed organizations from legacy systems to SaaS and implemented delivery systems for disciplined engineering results. Currently driving AI adoption and integration into a product platform for a digital health SaaS company. 
"

resume_experiences:
  - organization: "Claritas Rx"
    title: "Director of Platform Architecture"
    start: "2024"
    end: "Present"
    location: "Portland, OR"
    description: "Digital health SaaS company building the Ascend platform for specialty biopharmaceutical data intelligence. Progressed from Principal Architect to Director of Data Platform Engineering to Director of Platform Architecture, reporting directly to the CTO."
    bullets:
      - "Director of Platform Architecture (2026–Present): Provide architectural oversight across all engineering teams; own the technical strategy, multi-year roadmap, and technology governance for the Ascend SaaS platform. Champion AI adoption across product development; coaching teams on AI coding tools, establishing guardrails and usage policies, and deploying autonomous SDLC agents and workflow automations. Partner with Data Science and Product on AI feature integration and govern the company-wide AI tool stack with HIPAA/SOC2 compliance."
      - "Director of Data Platform Engineering (Nov 2024–2026): Led 16-person engineering team. Reduced hire-to-first-delivery from 2 months to 3 days via automated laptop provisioning, sandbox environments, and deployment tooling. Instituted SDLC and bi-weekly operational reviews enabling parallel roadmap delivery. Expanded Data Ingest adoption from 9 to 36 customers, totaling 90 data partners, 380 data partners and 1.1M data sets ingested. Launched first 3 SaaS customers on the new data platform for Ascend 2.0."
      - "Principal Architect (Jan–Nov 2024): Led architecture transformation from legacy data services toward SaaS product model. Launched internal Self Service app and external Ascend 2.0 web app. Introduced CI/CD pipelines, AWS Organizations and Control Tower governance, cross-account networking, and HIPAA/SOC2 data classification tagging. Adopted AWS Glue Data Catalog and PySpark ETL for data transformation."

resume_employment:
  - organization: "Roar Social"
    title: "Backend Software Architect"
    start: "2022"
    end: "2024"
    location: "Los Angeles, CA (Remote)"
    description: "Social network gamifying charitable giving. Led architecture design and backend implementation with a team of 25 engineers. Transformed a POC demo app to a secure, scalable, production-ready system in 9 months through the full SDLC."
    bullets:
      - "Load tested content delivery APIs at 100K TPS at <50ms average latency."
      - "Built event-driven personalized feed generation, content discovery APIs, donation flow, and administration system."
      - "Solved Lambda cold-start performance by migrating key services to a containerized NestJS service deployed to AWS Fargate."
      - "Led operational excellence program: dashboards, runbooks, and auto-generated ticketing on metric anomalies and log errors."

  - organization: "Amazon"
    title: "Cloud Application Architect"
    start: "2018"
    end: "2022"
    location: "Portland, OR"
    description: "Held multiple engineering roles across Amazon and AWS, building and scaling large-scale distributed systems."
    bullets:
      - "Selling Partner Services: Managed 1.6 TB of 3rd-party seller inventory data from 14 high-volume event sources. Scaled a data routing service to 340K TPS at 50ms latency using Go and ECS Fargate auto-scaling. Led modernization of 160+ data clients across 90 teams; drove 30% reduction in high-severity tickets."
      - "AWS Training & Certification: Defined microservices modernization roadmap for a C# monolith serving millions of students. Improved Course Search performance with OpenSearch. Scaled LMS to 50K TPS for re:Invent. Led EU cookie consent compliance across all AWS training web properties."
      - "AWS Professional Services: Led 3–9 month cloud-native engagements for Whole Foods Market eStore, DoorDash deployment modernization, Alexa Music Skills, and Portland General Electric Landing Zone. Built voice-UI testing framework for Drive-Through Automation R&D. Certified AWS Speaker."

  - organization: "Nike"
    title: "Tech Lead, Trial Zone"
    start: "2016"
    end: "2018"
    location: "Portland, OR"
    description: "Took over an agency-created retail experience POC and built a team to secure, standardize, and scale the system to 8 flagship Nike retail locations across US, Europe, and China. The Trial Zone supports digitally enhanced AR running and basketball experiences tied to shoe product launches."
    bullets:
      - "Implemented CI/CD to maintain a fleet of on-site servers with Kinect sensors, video streams, and game engines, supported by cloud-based monitoring and content delivery."
      - "Refactored Unity3D games to use configurable assets for product and venue-specific experiences."
      - "Automated site-specific configuration to support scaling to additional locations."

